<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎤 Shadowing 跟讀練習 · Unit 4</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#13253f;--gold:#ffc23d;--cream:#fffaf2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#13253f,#2b2152);color:#1d2433;font:18px/1.6 'Nunito','Noto Sans TC',sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h1{font:700 30px 'Fredoka',sans-serif;color:#fff;margin:6px 0 2px}.sub{color:#c9d4ec;margin:0 0 14px;font-size:15px}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25);margin-bottom:14px}
.bar label{font-weight:800;color:var(--navy);display:flex;gap:5px;align-items:center;font-size:15px}
select{font:600 15px 'Nunito',sans-serif;border-radius:8px;padding:4px;max-width:240px}
.prog{margin-left:auto;font-weight:800;color:var(--navy);font-size:15px}.prog b{color:#1a8f4c}
.card{background:var(--cream);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.2);border-left:7px solid #e8dcc0}
.card.pass{border-left-color:#22a55a}.card.now{outline:3px solid var(--gold)}
.top{display:flex;gap:10px;align-items:flex-start}.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);font:700 17px/34px 'Fredoka';text-align:center}
.en{font-size:21px;line-height:1.5;flex:1}.en .w{border-radius:5px;padding:0 1px}.en .w.ok{background:#d6f5df;color:#11683a}.en .w.bad{background:#ffe0e3;color:#b3123f;text-decoration:underline wavy #e04060}
.zh{display:none;color:#6b5a78;font-size:15px;margin-top:2px}.card.zon .zh{display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button{font:700 15px 'Nunito','Noto Sans TC',sans-serif;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;background:#efe6d2;color:var(--navy)}
button:hover{filter:brightness(.96)}.b-rec{background:#ff5a6e;color:#fff}.b-rec.on{animation:pulse 1s infinite;background:#d6203a}
.b-play{background:var(--gold)}.zb{background:#f3ead2;width:36px;height:36px;padding:0;border-radius:50%}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,90,110,.3)}}
.res{margin-top:8px;font-size:15px;display:none}.res.show{display:block}
.score{display:inline-block;font:700 20px 'Fredoka';border-radius:10px;padding:2px 10px;margin-right:8px;color:#fff}
.s-hi{background:#22a55a}.s-mid{background:#f0a020}.s-lo{background:#e04060}
.heard{color:#5b6475}.saved{color:#1a8f4c;font-weight:800;margin-left:6px}
.warn{background:#fff1c2;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.tip{color:#c9d4ec;font-size:14px;margin:6px 2px 12px}
@media(max-width:600px){.en{font-size:18px}h1{font-size:24px}.prog{margin-left:0}}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.hbtns{display:flex;gap:8px;flex-wrap:wrap}
#hubBtn,#backBtn{border-radius:999px;padding:9px 14px;font:700 15px 'Fredoka','Noto Sans TC',sans-serif;text-decoration:none;cursor:pointer;border:0}
#hubBtn{background:#2b5fd9;color:#fff;display:none}#hubBtn.on{display:inline-block}#backBtn{background:var(--gold);color:var(--navy)}
.card.reading{outline:3px solid #7fb2ff;background:#fffdf0}.b-all{background:#2bb38a;color:#fff}
</style></head><body><div class="wrap">
<div class="hdr"><h1>🎤 Shadowing 跟讀練習</h1><div class="hbtns"><button id="backBtn" title="回到 Unit 4 講義">↩ 回到講義</button><a id="hubBtn" href="https://script.google.com/macros/s/AKfycbxbvCl1gakDY4ppxQBd0KA093N7wQdug2qWZ4zUHDwpBw4dsEU08CdjHzb68DXPdx7I/exec" title="回到英文課程講義總覽（只有老師看得到）">📚 講義總覽</a></div></div>
<p class="sub">Unit 4 · "Let me tell you about digital currency!" 跟同學介紹數位貨幣</p>
<div id="warn"></div>
<div class="bar">
  <label>🎙️ 聲音 <select id="voice"></select></label>
  <label>🐢 速度 <select id="rate"><option value="0.6">60%</option><option value="0.7">70%</option><option value="0.8" selected>80%</option><option value="0.9">90%</option><option value="1">100%</option></select></label>
  <button class="b-all" id="playAll">▶ 全篇聽 Listen all</button><button id="allZh">中文 全部</button>
  <span class="prog">完成 <b id="done">0</b> / <span id="tot">10</span> 句 <small>(80 分以上)</small></span>
</div>
<p class="tip">🎧 你的錄音會存給老師聽。① 按 🔊 聽 → ② 按 🎤 跟著唸（唸完會自動停）→ ③ AI 馬上告訴你哪些字唸對（綠色）、哪些要再練（紅色）→ ▶ 聽聽自己的錄音。每一次都會記錄成學習歷程。</p>
<div id="list"></div>
</div>
<script>
const SENTS=[["Hi everyone! Today I want to tell you about digital currency.", "大家好！今天我想跟大家介紹數位貨幣。"], ["Digital currency is money that only exists online. You can't hold it in your hand.", "數位貨幣是只存在網路上的錢，你沒辦法把它拿在手上。"], ["You don't need a bank in the middle. The money goes straight from me to you.", "中間不需要銀行，錢直接從我這裡到你那裡。"], ["Bitcoin is the most famous one. It uses cryptography to keep every transaction safe.", "比特幣是最有名的一種，它用密碼學讓每一筆交易都很安全。"], ["Have you ever bought coins in a game? That's a kind of virtual currency, too.", "你有在遊戲裡買過金幣嗎？那也是一種虛擬貨幣喔。"], ["Some countries are making their own digital money. It's called a CBDC.", "有些國家正在做自己的數位貨幣，叫做 CBDC（央行數位貨幣）。"], ["The good part is that the records are transparent, so everyone can check them.", "好處是紀錄是透明的，所以大家都可以查。"], ["But be careful! Your wallet can be hacked, so keep your password safe.", "不過要小心！你的錢包可能會被駭，所以密碼要保管好。"], ["The price can go up and down really fast. It's super volatile.", "價格可能漲跌得很快，非常不穩定。"], ["So, would you try digital money? Tell me what you think. Thanks for listening!", "所以，你會想試試數位貨幣嗎？告訴我你的想法。謝謝大家聽我說！"]];
const S=window.speechSynthesis,REC=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);const best={};let busy=false;
function warn(h){$('warn').innerHTML=h?`<div class="warn">${h}</div>`:''}
if(!REC)warn('⚠️ 這個瀏覽器不能做發音檢查。請用 <b>Chrome</b> 或 <b>Edge</b>（電腦或 Android 手機）打開。iPhone 請用 Safari，並允許使用麥克風。');
/* voices grouped by accent */
const FLAG={US:'🇺🇸 美國',GB:'🇬🇧 英國',AU:'🇦🇺 澳洲',CA:'🇨🇦 加拿大',NZ:'🇳🇿 紐西蘭',IE:'🇮🇪 愛爾蘭',IN:'🇮🇳 印度',ZA:'🇿🇦 南非'};
const reg=v=>((v.lang||'').split(/[-_]/)[1]||'').toUpperCase();
const nice=v=>v.name.replace(/^(Microsoft|Google)\s+/,'').replace(/\s*Online\s*\(Natural\)/i,'').replace(/\s*-\s*English.*$/i,'').trim();
let VS=[];
function loadV(){if(!S)return;const vs=S.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return;VS=vs;const keep=$('voice').value;
  const groups=Object.keys(FLAG).concat(['']).map(r=>[r,vs.filter(v=>r?reg(v)===r:!FLAG[reg(v)]).sort((a,b)=>(/natural|online|google/i.test(b.name))-(/natural|online|google/i.test(a.name)))]).filter(g=>g[1].length);
  $('voice').innerHTML=groups.map(([r,l])=>`<optgroup label="${r?FLAG[r]+'口音':'🌏 其他口音'}">${l.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${nice(v)}</option>`).join('')}</optgroup>`).join('');
  if(keep&&vs.some(v=>v.name===keep))$('voice').value=keep;else{const d=vs.find(v=>reg(v)==='US'&&/natural|online/i.test(v.name))||vs.find(v=>reg(v)==='US')||vs[0];$('voice').value=d.name}}
if(S){S.onvoiceschanged=loadV;loadV();setTimeout(loadV,500);setTimeout(loadV,1500)}
function speak(t){return new Promise(res=>{if(!S){res();return}S.cancel();const u=new SpeechSynthesisUtterance(t);const v=VS.find(x=>x.name===$('voice').value);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=+$('rate').value;u.onend=u.onerror=res;S.speak(u)})}
/* scoring */
const NUM={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function norm(s){const w=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean).map(x=>NUM[x]||x.replace(/^'+|'+$/g,'')).filter(Boolean);
  const out=[];let run=[];const flush=()=>{if(run.length>=2){let j=run.join('');if(/^[ai]/.test(j)&&j.length>=4){out.push(j[0]);j=j.slice(1)}out.push(j)}else out.push(...run);run=[]};
  for(const x of w){if(/^[a-z]$/.test(x))run.push(x);else{flush();out.push(x)}}flush();
  return out.map(x=>x.replace(/'s$/,'s'))}
function align(target,heard){const a=target,b=heard,n=a.length,m=b.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}return ok}
function tokens(t){return t.split(/\s+/).map(w=>({raw:w,key:norm(w).join('')}))}
/* cards */
$('tot').textContent=SENTS.length;
$('list').innerHTML=SENTS.map(([e,z],i)=>`<div class="card" id="c${i}"><div class="top"><span class="num">${i+1}</span><div class="en" id="e${i}">${tokens(e).map((t,k)=>`<span class="w" data-k="${k}">${t.raw}</span>`).join(' ')}<div class="zh">${z}</div></div><button class="zb" data-z="${i}">中</button></div>
<div class="btns"><button class="b-play" data-p="${i}">🔊 聽</button><button class="b-rec" data-r="${i}">🎤 跟著唸</button><button data-me="${i}" style="display:none">▶ 聽我自己</button></div>
<div class="res" id="r${i}"></div></div>`).join('');
const audio={};const PL=new Audio();PL.setAttribute('playsinline','');
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.z!=null)$('c'+b.dataset.z).classList.toggle('zon');
  if(b.id==='playAll'){playAll(b);return}
  if(b.id==='allZh'){const on=!document.querySelector('.card.zon');document.querySelectorAll('.card').forEach(c=>c.classList.toggle('zon',on))}
  if(b.dataset.p!=null){focusCard(+b.dataset.p);speak(SENTS[+b.dataset.p][0])}
  if(b.dataset.me!=null){const a=audio[b.dataset.me];if(a){if(S)S.cancel();PL.pause();PL.src=a;PL.currentTime=0;PL.play().catch(()=>{})}}
  if(b.dataset.r!=null)record(+b.dataset.r,b)});
let allRun=0;
async function playAll(b){if(!S)return;if(b.dataset.on){allRun++;S.cancel();b.dataset.on='';b.textContent='▶ 全篇聽 Listen all';document.querySelectorAll('.card.reading').forEach(c=>c.classList.remove('reading'));return}
  const id=++allRun;b.dataset.on='1';b.textContent='■ 停止';
  for(let i=0;i<SENTS.length;i++){if(id!==allRun)return;const c=$('c'+i);document.querySelectorAll('.card.reading').forEach(x=>x.classList.remove('reading'));c.classList.add('reading');
    const r=c.getBoundingClientRect();if(r.top<90||r.bottom>innerHeight-20)c.scrollIntoView({block:'center',behavior:'smooth'});
    await speak(SENTS[i][0]);if(id!==allRun)return;await new Promise(r=>setTimeout(r,600))}
  if(id===allRun){b.dataset.on='';b.textContent='▶ 全篇聽 Listen all';document.querySelectorAll('.card.reading').forEach(x=>x.classList.remove('reading'))}}
function focusCard(i){document.querySelectorAll('.card.now').forEach(c=>c.classList.remove('now'));$('c'+i).classList.add('now')}
let NOREC=false;try{NOREC=localStorage.getItem('shNoRec')==='1'}catch(_){}
function record(i,btn){if(!REC){warn('⚠️ 這個瀏覽器不能做發音檢查，請改用 Chrome 或 Edge。');return}
  if(busy)return;busy=true;focusCard(i);if(S)S.cancel();PL.pause();
  const res=$('r'+i);res.className='res show';
  /* 先啟動語音辨識（iPhone 要在按下的當下啟動，並讓辨識先拿到麥克風） */
  const r=new REC();r.lang='en-US';r.interimResults=true;r.maxAlternatives=3;r.continuous=true;
  let segs=[],alts=[],lastTxt='',got=false,started=false,mr=null,chunks=[],stream=null,usedRec=false,tSil=null,tMax=null,ended=false;
  const stop=()=>{try{r.stop()}catch(_){}};
  const arm=()=>{clearTimeout(tSil);tSil=setTimeout(stop,got?1800:9000)};
  res.innerHTML='⏳ 準備麥克風…';btn.classList.add('on');btn.textContent='⏺ 錄音中… 按這裡結束';btn.onclick=stop;
  r.onstart=()=>{started=true;res.innerHTML='🔴 <b>現在請開始唸</b>（唸完停一下就會自動結束）';arm();tMax=setTimeout(stop,20000);
    if(!NOREC&&navigator.mediaDevices&&window.MediaRecorder){navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(st=>{if(ended){st.getTracks().forEach(t=>t.stop());return}
      stream=st;usedRec=true;try{mr=new MediaRecorder(st,{audioBitsPerSecond:32000})}catch(_){mr=new MediaRecorder(st)}mr.ondataavailable=ev=>chunks.push(ev.data);mr.start()}).catch(()=>{})}};
  r.onresult=ev=>{got=true;const R=[...ev.results];lastTxt=R.map(x=>x[0].transcript).join(' ').replace(/\s+/g,' ').trim();res.innerHTML='🎧 '+lastTxt.replace(/</g,'&lt;');
    const head=R.slice(0,-1).map(x=>x[0].transcript).join(' '),last=R[R.length-1];alts=[];for(let k=0;k<last.length;k++)alts.push((head+' '+last[k].transcript).trim());arm()};
  r.onerror=ev=>{const m={'not-allowed':'🎤 語音辨識沒有權限使用麥克風。iPhone：設定 → Safari → 麥克風 →「允許」；或按網址列左邊的圖示允許麥克風，再按一次 🎤。','audio-capture':'🎤 麥克風被別的程式占用或找不到。請關掉其他正在用麥克風的 App（LINE 通話、錄音、視訊），再試一次。','network':'🌐 語音辨識需要網路，請確認網路後再試。','service-not-allowed':'🎤 這個瀏覽器不能使用語音辨識。iPhone 請到 設定 → Siri → 開啟「聽寫」；其他手機請改用 Chrome。'}[ev.error];
    if(m)warn(m+' <small>（'+ev.error+'）</small>')};
  r.onend=()=>{ended=true;clearTimeout(tSil);clearTimeout(tMax);btn.classList.remove('on');btn.textContent='🎤 再唸一次';btn.onclick=null;
    busy=false;const list=alts.length?alts:(lastTxt?[lastTxt]:[]);
    if(mr&&mr.state!=='inactive'){mr.onstop=()=>{const mt=mr.mimeType||'audio/mp4',bl=new Blob(chunks,{type:mt});audio[i]=URL.createObjectURL(bl);document.querySelector(`[data-me="${i}"]`).style.display='';
        if(stream)stream.getTracks().forEach(t=>t.stop());
        if(list.length){const fr=new FileReader();fr.onload=()=>grade(i,list,String(fr.result).split(',')[1]||'',mt);fr.onerror=()=>grade(i,list);fr.readAsDataURL(bl)}};
      try{mr.stop()}catch(_){if(list.length)grade(i,list)}if(list.length)return}
    else if(stream)setTimeout(()=>stream.getTracks().forEach(t=>t.stop()),300);
    if(list.length){grade(i,list);return}
    if(usedRec&&!NOREC){NOREC=true;try{localStorage.setItem('shNoRec','1')}catch(_){}
      res.innerHTML='🔧 這支手機不能同時「錄音」和「AI 聽發音」，已自動改成只做 AI 發音檢查（不保留錄音）。<b>請再按一次 🎤 唸一次。</b>';return}
    res.innerHTML='😶 AI 沒有聽到你的聲音。請：① 看到 🔴「現在請開始唸」再開口 ② 手機拿近一點、大聲一點 ③ 關掉其他用麥克風的 App（例如 LINE 通話），再試一次。'};
  try{r.start()}catch(err){busy=false;btn.classList.remove('on');btn.textContent='🎤 跟著唸';btn.onclick=null;res.innerHTML='⚠️ 麥克風還沒準備好，請再按一次 🎤。'}}
function grade(i,alts,au,mt){const toks=tokens(SENTS[i][0]).filter(t=>t.key);const tk=toks.map(t=>t.key);
  let bestA=null;for(const h of alts){const ok=align(tk,norm(h));const sc=Math.round(ok.filter(Boolean).length*100/tk.length);if(!bestA||sc>bestA.sc)bestA={sc,ok,h}}
  const spans=[...$('e'+i).querySelectorAll('.w')];let k=0;spans.forEach(s=>{const key=norm(s.textContent).join('');s.className='w';if(!key)return;s.classList.add(bestA.ok[k]?'ok':'bad');k++});
  const sc=bestA.sc,cls=sc>=80?'s-hi':sc>=60?'s-mid':'s-lo',msg=sc>=90?'🌟 Excellent! 發音很棒！':sc>=80?'👍 Good job! 很好！':sc>=60?'💪 不錯，紅色的字再練一下':'🔁 慢一點、清楚一點，再試一次';
  $('r'+i).innerHTML=`<span class="score ${cls}">${sc}</span>${msg}<div class="heard">AI 聽到：「${bestA.h.trim().replace(/</g,'&lt;')}」<span class="saved" id="sv${i}"></span></div>`;
  best[i]=Math.max(best[i]||0,sc);$('c'+i).classList.toggle('pass',best[i]>=80);$('done').textContent=Object.values(best).filter(x=>x>=80).length;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);PEND[id]={src:'shadow',id,i,score:sc,heard:bestA.h.trim().slice(0,300),audio:au||'',mime:mt||''};savePend();$('sv'+i).dataset.id=id;$('sv'+i).textContent=' ⏳ 存檔中…';sendPend();
  setTimeout(()=>{const e=$('sv'+i);if(e&&e.dataset.id===id&&PEND[id])e.innerHTML=' ⚠️ 還沒存到：請按上面的「↩ 回到講義」，回到講義後會自動補存。'},8000)}
let PEND={};try{PEND=JSON.parse(localStorage.getItem('shPend')||'{}')}catch(_){}
function savePend(){try{const o={};for(const k in PEND)o[k]=Object.assign({},PEND[k],{audio:''});localStorage.setItem('shPend',JSON.stringify(o))}catch(_){}}
function sendPend(){try{if(window.opener&&!window.opener.closed)Object.values(PEND).forEach(m=>window.opener.postMessage(m,'*'))}catch(_){}}
setInterval(sendPend,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sendPend()});window.addEventListener('focus',sendPend);
window.addEventListener('message',e=>{const d=e.data||{};if(d.src==='shadowAck'){if(d.ok&&d.id){delete PEND[d.id];savePend()}const e=$('sv'+d.i);if(e&&(!d.id||e.dataset.id===d.id))e.textContent=d.ok?' ✅ 已記錄':' ⚠️ 沒有記錄到，請再唸一次';}
  if(d.src==='shadowBest'&&d.teacher)$('hubBtn').classList.add('on');
  if(d.src==='shadowBest'&&d.best){Object.entries(d.best).forEach(([i,s])=>{best[i]=s;const c=$('c'+i);if(c)c.classList.toggle('pass',s>=80)});$('done').textContent=Object.values(best).filter(x=>x>=80).length}});
try{if(window.opener)window.opener.postMessage({src:'shadowHello'},'*')}catch(_){}sendPend();
